<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#050e24"/>
      <stop offset="80%" stop-color="#0b1739"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="offset" values="0; 1; 0" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#60A5FA">
        <animate attributeName="offset" values="0.35; 1.35; 0.35" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#00F5FF">
        <animate attributeName="offset" values="0.7; 1.7; 0.7" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="offset" values="1; 2; 1" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Horizon Mask -->
    <linearGradient id="horizonFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect x="0" y="160" width="1200" height="160" fill="url(#horizonFade)"/>
    </mask>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatGrid {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }
      @keyframes scanBeam {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes pulseOrb {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes counterRotate {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .star-1 { animation: twinkle 3s ease-in-out infinite; }
      .star-2 { animation: twinkle 2s ease-in-out infinite 1s; }
      .star-3 { animation: twinkle 4s ease-in-out infinite 2s; }
      .grid-lines { animation: floatGrid 1.8s linear infinite; }
      .laser-scanner { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .glow-pulse { animation: pulseOrb 4s ease-in-out infinite; transform-origin: center; }
      .ring-cw { animation: rotateRing 20s linear infinite; transform-origin: 600px 140px; }
      .ring-ccw { animation: counterRotate 25s linear infinite; transform-origin: 600px 140px; }
    </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />

  <!-- Background Cyber Stars -->
  <g fill="#93C5FD">
    <circle cx="85" cy="45" r="1.5" class="star-1" />
    <circle cx="160" cy="110" r="1" class="star-2" />
    <circle cx="280" cy="35" r="2" class="star-3" />
    <circle cx="420" cy="80" r="1.5" class="star-1" />
    <circle cx="750" cy="40" r="1" class="star-3" />
    <circle cx="890" cy="95" r="2" class="star-2" />
    <circle cx="1020" cy="30" r="1" class="star-1" />
    <circle cx="1110" cy="85" r="2.5" class="star-3" />
    <circle cx="210" cy="190" r="1" class="star-2" />
    <circle cx="980" cy="210" r="1.5" class="star-1" />
    <circle cx="50" cy="270" r="2" class="star-3" />
    <circle cx="1140" cy="250" r="1.5" class="star-2" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="600" cy="130" r="180" fill="#1E3A8A" opacity="0.35" filter="url(#neonGlow)" class="glow-pulse" />
  <circle cx="350" cy="100" r="100" fill="#0284C7" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="850" cy="120" r="120" fill="#2563EB" opacity="0.2" filter="url(#neonGlow)" />

  <!-- Sci-Fi Orbital Rings (Behind Text) -->
  <g opacity="0.25">
    <circle cx="600" cy="140" r="170" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 12" class="ring-cw" />
    <circle cx="600" cy="140" r="195" fill="none" stroke="#60A5FA" stroke-width="0.8" stroke-dasharray="24 16" class="ring-ccw" />
  </g>

  <!-- Perspective 3D Cyberspace Grid (Bottom) -->
  <g mask="url(#gridMask)">
    <!-- Perspective Horizon Converging Lines -->
    <g stroke="#1E40AF" stroke-width="1" opacity="0.6">
      <line x1="600" y1="160" x2="-200" y2="320" />
      <line x1="600" y1="160" x2="0" y2="320" />
      <line x1="600" y1="160" x2="150" y2="320" />
      <line x1="600" y1="160" x2="300" y2="320" />
      <line x1="600" y1="160" x2="450" y2="320" />
      <line x1="600" y1="160" x2="550" y2="320" />
      <line x1="600" y1="160" x2="650" y2="320" />
      <line x1="600" y1="160" x2="750" y2="320" />
      <line x1="600" y1="160" x2="900" y2="320" />
      <line x1="600" y1="160" x2="1050" y2="320" />
      <line x1="600" y1="160" x2="1200" y2="320" />
      <line x1="600" y1="160" x2="1400" y2="320" />
    </g>

    <!-- Animated Moving Horizontal Transverse Lines -->
    <g stroke="#38BDF8" stroke-width="1.2" opacity="0.7" class="grid-lines">
      <line x1="0" y1="165" x2="1200" y2="165" opacity="0.3" />
      <line x1="0" y1="180" x2="1200" y2="180" opacity="0.4" />
      <line x1="0" y1="205" x2="1200" y2="205" opacity="0.5" />
      <line x1="0" y1="235" x2="1200" y2="235" opacity="0.7" />
      <line x1="0" y1="275" x2="1200" y2="275" opacity="0.9" />
      <line x1="0" y1="320" x2="1200" y2="320" opacity="1.0" />
    </g>
  </g>

  <!-- Laser Scanning Radar Beam -->
  <g class="laser-scanner">
    <rect x="0" y="0" width="350" height="320" fill="url(#laserGrad)" opacity="0.25" />
    <line x1="175" y1="0" x2="175" y2="320" stroke="#00F5FF" stroke-width="2" opacity="0.85" filter="url(#subtleGlow)" />
  </g>

  <!-- Top System Diagnostics Bar -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#60A5FA" opacity="0.85">
    <text x="35" y="32">● NODE: SGC-BAREMETAL-01</text>
    <text x="240" y="32">KERNEL: DEBIAN 13 TRIXIE</text>
    <text x="460" y="32">ORCHESTRATION: DOCKER SWARM</text>
    <text x="730" y="32">RENDER: THREE.JS R174 // 120 FPS</text>
    <text x="1040" y="32" fill="#34D399">● STATUS: NOMINAL</text>
  </g>
  <line x1="30" y1="42" x2="1170" y2="42" stroke="#1E3A8A" stroke-width="1" opacity="0.6" />

  <!-- HUD Corner Brackets (Cyber Frame) -->
  <g stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.75">
    <!-- Top-Left -->
    <path d="M 25 65 L 25 25 L 65 25" />
    <!-- Top-Right -->
    <path d="M 1175 65 L 1175 25 L 1135 25" />
    <!-- Bottom-Left -->
    <path d="M 25 255 L 25 295 L 65 295" />
    <!-- Bottom-Right -->
    <path d="M 1175 255 L 1175 295 L 1135 295" />
  </g>

  <!-- Main Hero Title with Glowing Gradient Fill -->
  <text x="600" y="132"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="900"
        font-size="52"
        letter-spacing="5"
        fill="url(#textShimmer)"
        filter="url(#neonGlow)">
    S. GNAN CHARAN
  </text>
  <text x="600" y="132"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="900"
        font-size="52"
        letter-spacing="5"
        fill="#FFFFFF">
    S. GNAN CHARAN
  </text>

  <!-- Subtitle Terminal HUD Callout -->
  <rect x="250" y="160" width="700" height="34" rx="17" fill="#0A192F" stroke="#1E40AF" stroke-width="1.5" opacity="0.9" />
  <text x="600" y="182"
        text-anchor="middle"
        font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace"
        font-weight="700"
        font-size="14.5"
        letter-spacing="2"
        fill="#38BDF8">
    SYSTEMS &amp; INFRASTRUCTURE ENGINEER  •  3D SPATIAL COMPUTING
  </text>

  <!-- Cyber Badge Chips Underneath -->
  <g font-family="'Fira Code', monospace" font-size="11.5" font-weight="600" text-anchor="middle">
    <!-- Chip 1 -->
    <rect x="230" y="215" width="160" height="26" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="310" y="232" fill="#38BDF8">⚡ DEBIAN 13 / MBR</text>

    <!-- Chip 2 -->
    <rect x="410" y="215" width="180" height="26" rx="6" fill="#0F172A" stroke="#1D4ED8" stroke-width="1" />
    <text x="500" y="232" fill="#60A5FA">🐳 DOCKER SWARM</text>

    <!-- Chip 3 -->
    <rect x="610" y="215" width="170" height="26" rx="6" fill="#0F172A" stroke="#2563EB" stroke-width="1" />
    <text x="695" y="232" fill="#93C5FD">🪐 THREE.JS / WEBGL</text>

    <!-- Chip 4 -->
    <rect x="800" y="215" width="170" height="26" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1" />
    <text x="885" y="232" fill="#34D399">🧠 LOCAL AI / CUDA</text>
  </g>

  <!-- Live Pulse Dot in Top Left -->
  <circle cx="48" cy="275" r="4" fill="#38BDF8" filter="url(#subtleGlow)">
    <animate attributeName="r" values="3; 6; 3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="62" y="279" font-family="'Fira Code', monospace" font-size="11" fill="#93C5FD" opacity="0.9">
    ORBITAL TELEMETRY &amp; BARE METAL FABRIC // ONLINE
  </text>

  <!-- Bottom System Signature -->
  <text x="1150" y="279" text-anchor="end" font-family="'Fira Code', monospace" font-size="11" fill="#60A5FA" opacity="0.7">
    v2.6.4 [RELEASE-STABLE]
  </text>
</svg>
