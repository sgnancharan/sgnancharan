<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="60%" stop-color="#050e24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1739" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="neonWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <filter id="fGlow">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes waveFloat1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes waveFloat2 {
        0% { transform: translateX(0); }
        50% { transform: translateX(50px); }
        100% { transform: translateX(0); }
      }
      .wave-1 { animation: waveFloat1 6s ease-in-out infinite; }
      .wave-2 { animation: waveFloat2 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="120" fill="url(#footerBg)" />

  <!-- Animated Neon Wave Splines -->
  <g filter="url(#fGlow)" opacity="0.8">
    <path class="wave-1" d="M -100 60 Q 200 20 500 60 T 1100 60 T 1400 60" fill="none" stroke="url(#neonWave)" stroke-width="2.5" />
    <path class="wave-2" d="M -100 85 Q 300 45 650 85 T 1200 85 T 1500 85" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.6" stroke-dasharray="10 15" />
  </g>

  <!-- Centered Telemetry Status -->
  <text x="600" y="105"
        text-anchor="middle"
        font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace"
        font-size="12"
        letter-spacing="3"
        fill="#93C5FD">
    ✦ END OF TRANSMISSION // 2026 S. GNAN CHARAN // ALL SYSTEMS GO ✦
  </text>
</svg>
