</style><rect width="42" height="42" rx="10" fill="#171527"/><rect x=".7" y=".7" width="40.6" height="40.6" rx="9.5" fill="none" stroke="#ffb45f" stroke-opacity=".56"/><g fill="none" stroke="#ffb45f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 29V14l4-8 4 8v15Zm-5-11 2-4 1 3v11l-5 3zm17 0-1-4-1 3v11l5 3z"/><path class="beacon" d="m18 32 3 5 3-5"/></g>
