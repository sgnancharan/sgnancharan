<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 42 42" role="img" aria-labelledby="title desc">
<title id="title">Festival lamp</title><desc id="desc"></desc>
<style>
.prompt{animation:typecmd 8s steps(8,end) infinite}.cursor{animation:blink 1.25s step-end infinite}
@keyframes typecmd{0%,8%{width:0}30%,91%{width:95px}100%{width:0}}@keyframes blink{0%,65%{opacity:1}66%,100%{opacity:0}}
.float{animation:drift 7s ease-in-out infinite}.flame{animation:burn 1.2s ease-in-out infinite;transform-origin:0 46px}.dash{animation:dash 14s linear infinite}.beacon{animation:pulse 3.8s ease-in-out infinite}.twinkle{animation:pulse 5.3s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(-2px,3px)}50%{transform:translate(4px,-4px)}}@keyframes burn{0%,100%{transform:scale(1,.87)}50%{transform:scale(.96,1.08)}}
@keyframes dash{to{stroke-dashoffset:-90}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="42" height="42" rx="10" fill="#171527"/><rect x=".7" y=".7" width="40.6" height="40.6" rx="9.5" fill="none" stroke="#ff4dad" stroke-opacity=".56"/><g fill="none" stroke="#ff4dad" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 23h30q-4 11-15 11T6 23Z"/><path class="beacon" d="M18 20c-3-5 1-8 5-13 0 5 4 6 3 10-1 3-4 4-8 3Z"/><path d="M12 27h18"/></g>
